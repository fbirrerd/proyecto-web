<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Modulos</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        .popup {
            display: none;
            position: fixed;
            top: 20%;
            left: 30%;
            background: white;
            border: 1px solid #333;
            padding: 20px;
            z-index: 1000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Provincias</h2>
        <button class="btn btn-light" onclick="mostrarFilaNueva()">
            <i class="fa fa-plus"></i> Agregar
        </button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
            <select class="form-select w-auto" id="regionSelect" onchange="cargarProvincias()">
            <option value="">Selecciona una región</option>
            <option value="region1">Región 1</option>
            <option value="region2">Región 2</option>
            <option value="region3">Región 3</option>
        </select>
    </div>

    <table class="table table-striped mt-3" id="menuTable">
        <thead>
            <tr>
                <th>Nombre</th>
                <th style="width: 200px;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Filas dinámicas -->
        </tbody>
    </table>
</div>

</body>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Bootstrap JS Bundle (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts personalizados -->
<script src="../js/comun.js"></script>
<script src="js/provincias.js"></script>

</html>
