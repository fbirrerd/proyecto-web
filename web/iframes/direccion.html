<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario de Dirección</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 400px;
            margin-top: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>

<body class="container my-4">

    <h3>Formulario de Dirección</h3>
    <form id="direccionForm">



        <div class="row mb-3">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Región *</label>
                    <select class="form-select" id="region" required></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Provincia *</label>
                    <select class="form-select" id="provincia" required></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Comuna *</label>
                    <select class="form-select" id="comuna" required></select>
                </div>
            </div>


            <div class="col-md-6">
                <label class="form-label">Calle *</label>
                <input type="text" class="form-control" id="calle" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Número</label>
                <input type="text" class="form-control" id="numero">
            </div>
        </div>


        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Latitud</label>
                <input type="text" class="form-control" id="latitud" name="latitud">
            </div>
            <div class="col-md-6">
                <label class="form-label">Longitud</label>
                <input type="text" class="form-control" id="longitud" name="longitud">
            </div>
        </div>

        <div id="map"></div>

        <button type="submit" class="btn btn-primary mt-3">Guardar</button>
    </form>

    <!-- JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../js/comun.js"></script>
    <script src="js/direccion.js"></script>
</body>

</html>
