<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Adjunto de Imágenes</title>
    <!-- Vincular archivo CSS -->
    <link href="css/imagenes.css" rel="stylesheet">
    <!-- Vincular Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Incluir jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <form id="imageForm">
            <input type="hidden" id="folder" value="path/a/carpeta">
            <input type="hidden" id="fileId" value="12345">

            <!-- Imagen Previamente Cargada -->
            <div id="imagePreview" class="mb-3">
                <!-- Se mostrará la imagen si existe en la base de datos -->
            </div>

            <!-- Área para adjuntar archivo -->
            <div id="uploadArea" class="upload-area">
                <div>Arrastra una imagen aquí o haz clic para seleccionarla</div>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
                <img id="imagePreviewImg" class="hidden" />
            </div>

            <!-- Botones de Guardar y Eliminar -->
            <div id="buttons" class="mt-3 hidden">
                <button type="button" class="btn btn-primary" id="saveBtn">Guardar</button>
                <button type="button" class="btn btn-danger" id="deleteBtn">Eliminar</button>
            </div>

            <!-- Alertas de éxito o error -->
            <div id="alertContainer"></div>
        </form>
    </div>

    <!-- Vincular archivo JS -->
    <script src="js/imagenes.js"></script>
    <!-- Vincular Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
