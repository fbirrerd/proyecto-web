<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menú Médico Completo</title>

  <!-- Bootstrap y FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-size: 0.9rem;
    }

    .menu-toggle-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1100;
      font-size: 1.2rem;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 250px;
      background-color: #343a40;
      color: white;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      padding-top: 3rem;
    }

    .side-menu.show {
      transform: translateX(0);
    }

    .menu-link {
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .menu-link:hover {
      background-color: #495057;
    }

    .submenu-icon {
      margin-left: auto;
      transition: transform 0.3s ease;
    }

    .submenu-icon.rotate {
      transform: rotate(90deg);
    }

    .collapse .menu-link {
      padding-left: 2.5rem;
    }

    .collapse .collapse .menu-link {
      padding-left: 3.5rem;
    }

    .menu-section-title {
      padding: 0.5rem 1rem;
      font-weight: bold;
      color: #ced4da;
    }

    .main-content {
      margin-left: 0;
      padding: 1rem;
    }

    @media (min-width: 768px) {
      .main-content {
        margin-left: 260px;
      }
    }

    /* Fondo para clic afuera del menú */
    #menu-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 900;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
    }

    #menu-overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Botón de apertura -->
  <button class="btn btn-dark menu-toggle-btn" onclick="toggleMenu()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Fondo oscuro para detectar clic fuera del menú -->
  <div id="menu-overlay" onclick="closeMenu()"></div>

  <!-- Menú lateral -->
  <div id="sideMenu" class="side-menu">

    <div class="menu-section-title">MÓDULOS</div>

    <!-- VADEMÉCUM -->
    <a class="menu-link" data-bs-toggle="collapse" href="#vademecum" role="button" onclick="toggleArrow(this)">
      <i class="fas fa-book-medical me-2"></i> Vademécum
      <i class="fas fa-chevron-right submenu-icon"></i>
    </a>
    <div class="collapse" id="vademecum">
      <a class="menu-link" href="#" onclick="abrirEnIframe('vademecum/buscador')">
        <i class="fas fa-search me-2"></i> Buscador
      </a>
      <a class="menu-link" data-bs-toggle="collapse" href="#sub-vademecum" role="button" onclick="toggleArrow(this)">
        <i class="fas fa-pills me-2"></i> Categorías
        <i class="fas fa-chevron-right submenu-icon"></i>
      </a>
      <div class="collapse" id="sub-vademecum">
        <a class="menu-link" href="#" onclick="abrirEnIframe('vademecum/antibioticos')">Antibióticos</a>
        <a class="menu-link" href="#" onclick="abrirEnIframe('vademecum/analgesicos')">Analgésicos</a>
      </div>
    </div>

    <!-- AGENDA -->
    <a class="menu-link" data-bs-toggle="collapse" href="#agenda" role="button" onclick="toggleArrow(this)">
      <i class="fas fa-calendar-alt me-2"></i> Agenda
      <i class="fas fa-chevron-right submenu-icon"></i>
    </a>
    <div class="collapse" id="agenda">
      <a class="menu-link" href="#" onclick="abrirEnIframe('agenda/calendario')">
        <i class="fas fa-calendar-day me-2"></i> Calendario
      </a>
      <a class="menu-link" data-bs-toggle="collapse" href="#sub-agenda" role="button" onclick="toggleArrow(this)">
        <i class="fas fa-user-clock me-2"></i> Citas
        <i class="fas fa-chevron-right submenu-icon"></i>
      </a>
      <div class="collapse" id="sub-agenda">
        <a class="menu-link" href="#" onclick="abrirEnIframe('agenda/citas/pacientes')">Con pacientes</a>
        <a class="menu-link" href="#" onclick="abrirEnIframe('agenda/citas/salas')">En salas</a>
      </div>
    </div>

    <!-- REPORTES -->
    <a class="menu-link" data-bs-toggle="collapse" href="#reportes" role="button" onclick="toggleArrow(this)">
      <i class="fas fa-chart-bar me-2"></i> Reportes
      <i class="fas fa-chevron-right submenu-icon"></i>
    </a>
    <div class="collapse" id="reportes">
      <a class="menu-link" href="#" onclick="abrirEnIframe('reportes/consultas')">Consultas</a>
      <a class="menu-link" href="#" onclick="abrirEnIframe('reportes/recetas')">Recetas</a>
    </div>

    <!-- CONFIGURACIÓN -->
    <a class="menu-link" data-bs-toggle="collapse" href="#configuracion" role="button" onclick="toggleArrow(this)">
      <i class="fas fa-cog me-2"></i> Configuración
      <i class="fas fa-chevron-right submenu-icon"></i>
    </a>
    <div class="collapse" id="configuracion">
      <a class="menu-link" href="#" onclick="abrirEnIframe('configuracion/perfil')">Perfil</a>
      <a class="menu-link" href="#" onclick="abrirEnIframe('configuracion/preferencias')">Preferencias</a>
    </div>

    <!-- CERRAR SESIÓN -->
    <a class="menu-link mt-3" href="#" onclick="cerrarSesion()">
      <i class="fas fa-sign-out-alt me-2"></i> Cerrar sesión
    </a>
  </div>

  <!-- Contenido -->
  <div class="main-content">
    <h1>Bienvenido</h1>
    <p>Selecciona una opción del menú.</p>
    <!-- <iframe id="main-iframe" width="100%" height="600px" frameborder="0"></iframe> -->
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menu-overlay');

    function toggleMenu() {
      menu.classList.toggle('show');
      overlay.classList.toggle('show');

      if (!menu.classList.contains('show')) {
        closeAllSubmenus();
      }
    }

    function closeMenu() {
      menu.classList.remove('show');
      overlay.classList.remove('show');
      closeAllSubmenus();
    }

    function closeAllSubmenus() {
      const collapses = menu.querySelectorAll('.collapse');
      collapses.forEach(c => {
        const instance = bootstrap.Collapse.getOrCreateInstance(c);
        instance.hide();
      });

      const icons = menu.querySelectorAll('.submenu-icon.rotate');
      icons.forEach(i => i.classList.remove('rotate'));
    }

    function toggleArrow(el) {
      const icon = el.querySelector('.submenu-icon');
      if (icon) icon.classList.toggle('rotate');
    }

    function abrirEnIframe(url) {
      console.log("Abrir:", url);
      // document.getElementById('main-iframe').src = url;
      closeMenu();
    }

    function cerrarSesion() {
      alert("Sesión cerrada.");
    }
  </script>
</body>
</html>
