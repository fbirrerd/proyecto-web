<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tipo Empresa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Tipos de Empresa</h2>
      <button id="btnNuevo" class="btn btn-light">
        <i class="fa fa-plus"></i> Agregar
      </button>
    </div>

    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th class="acciones-td">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Filas dinámicas -->
      </tbody>
    </table>
  </div>

  <!-- Modal Agregar/Editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="formTipoEmpresa">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Editar Tipo Empresa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formularioTipoEmpresa">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" name="nombre" id="inputNombreEditar" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select class="form-select" name="inputEstadoEditar" id="inputEstadoEditar">
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
              </select>
            </div>
          </div>
          <div id="empresasAsociadas" class="mt-4">
            <h5 class="mb-3 text-secondary">Empresas asociadas al tipo seleccionado</h5>
            <ul class="list-group list-group-flush border rounded shadow-sm" id="empresasTipoList">
              <!-- Los elementos de la lista se agregarán dinámicamente -->
            </ul>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/render/tipoEmpresa.js"></script>
</body>
</html>
