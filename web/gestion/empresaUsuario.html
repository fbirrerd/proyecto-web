<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Empresa - Usuario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Relación Empresa Usuarios</h2>
      <button class="btn btn-light" onclick="agregarFilaInline()">
        <i class="fa fa-plus"></i> Agregar
      </button>
    </div>

    <table class="table table-striped mt-3" id="tabla-empresa-usuario">
      <thead>
        <tr>
          <th>Empresa</th>
          <th>Usuario</th>
          <th class="acciones-td">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
<!-- Modal para editar roles -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="modalEditarRolesLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarRolesLabel">Editar Roles para Usuario en Empresa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formEditarRoles">
          <input type="hidden" id="editEmpresaId">
          <input type="hidden" id="editUsuarioId">
          <div class="mb-3">
            <label class="form-label">Empresa</label>
            <input type="text" id="editEmpresaNombre" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="editUsuarioNombre" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Roles</label>
            <div id="checkboxRoles" class="d-flex flex-wrap gap-2"></div>
          </div>
          <button type="submit" class="btn btn-success">Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Bootstrap JS Bundle (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Scripts personalizados -->
<script src="../js/comun.js"></script>
<script src="../js/render/empresaUsuario.js"></script>
</html>
