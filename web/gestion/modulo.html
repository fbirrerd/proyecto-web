<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Módulos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body class="bg-light py-4">

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Módulos</h2>
            <button class="btn btn-light" onclick="mostrarFilaNueva()">
                <i class="fa fa-plus"></i> Agregar
            </button>
        </div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th class="acciones-col"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Filas dinámicas se llenan aquí -->
            </tbody>
        </table>
    </div>

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="moduloModal" tabindex="-1" aria-labelledby="moduloModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="moduloModalLabel">Detalle del Módulo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <!-- Nav tabs -->
                    <ul class="nav nav-tabs" id="moduloTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="datos-tab" data-bs-toggle="tab" data-bs-target="#datos" type="button" role="tab">Inventario</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="empresas-tab" data-bs-toggle="tab" data-bs-target="#empresas" type="button" role="tab">Empresas Asociadas</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="menus-tab" data-bs-toggle="tab" data-bs-target="#menus" type="button" role="tab">Menús Asociados</button>
                        </li>
                    </ul>

                    <!-- Tab panes -->
                    <div class="tab-content mt-3">
                        <div class="tab-pane fade show active" id="datos" role="tabpanel">
                            <div id="datosContenido">
                                <!-- Aquí se cargan los datos del inventario -->
                                <p>Cargando datos...</p>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="empresas" role="tabpanel">
                            <div id="empresasContenido">
                                <!-- Aquí se cargan las empresas asociadas -->
                                <p>Cargando empresas...</p>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="menus" role="tabpanel">
                            <div id="menusContenido">
                                <!-- Aquí se cargan los menús asociados -->
                                <p>Cargando menús...</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarCambiosModulo()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Scripts personalizados -->
    <script src="../js/comun.js"></script>
    <script src="../js/render/modulo.js"></script>
</body>
</html>
