<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Menús Generales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light py-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Empresas   </h2>
            <button class="btn btn-light" onclick="abrirModal()">
                <i class="fa fa-plus"></i> Agregar
            </button>
        </div>
        <table class="table table-striped mt-3">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Tipo</th>
                <th class="acciones-col"></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
    </div>

<!-- Botón -->


<!-- Modal -->
<div class="modal fade" id="modalEmpresa" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="formEmpresa">
        <div class="modal-header">
          <h5 class="modal-title">Empresa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <!-- Nav Tabs -->
          <ul class="nav nav-tabs mb-3" id="empresaTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="datos-tab" data-bs-toggle="tab" data-bs-target="#datos" type="button" role="tab">Información</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="modulos-tab" data-bs-toggle="tab" data-bs-target="#modulos" type="button" role="tab">Módulos Asociados</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button" role="tab">Usuarios</button>
            </li>
          </ul>

          <!-- Tab Content -->
          <div class="tab-content" id="empresaTabsContent">
            <!-- Tab 1: Datos de la empresa -->
            <div class="tab-pane fade show active" id="datos" role="tabpanel">
              <input type="hidden" id="empresaId">

              <div class="mb-3">
                <label>Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>

              <div class="mb-3">
                <label>Tipo Empresa</label>
                <select class="form-select" id="tipoEmpresa" required></select>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="estado" checked>
                <label class="form-check-label">Activo</label>
              </div>
            </div>

            <!-- Tab 2: Módulos asociados -->
            <div class="tab-pane fade" id="modulos" role="tabpanel">
              <h6 class="mb-2">Selecciona los módulos asociados</h6>
              <div id="modulosContainer" class="row"></div>
            </div>
            <!-- Tab 3: Usuarios -->
            <div class="tab-pane fade" id="Usuarios" role="tabpanel">
              <h6 class="mb-2">Usuarios pertenecientes a la Empresa</h6>
              <div id="usuariosContainer"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">💾 Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>



    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <script src="../js/comun.js"></script>
    <script src="../js/render/empresas.js"></script></body>

</html>
