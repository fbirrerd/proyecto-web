<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Menús</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome para íconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="bg-light py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Menu General</h2>
        <button class="btn btn-ligth" onclick="mostrarFilaNueva()">
          <i class="fa fa-plus"></i> Agregar
        </button>
      </div>

      <div class="input-group mb-3">
        <input
          type="text"
          id="filtroGeneral"
          class="form-control"
          placeholder="Buscar en la tabla..."
        />
      </div>
      <table
        class="table table-striped mt-3"
        id="menuTable"
      >
        <thead>
          <tr>
            <th>Icono</th>
            <th>Nombre</th>
            <th>Ruta</th>
            <!-- <th>Tipo</th> -->
            <th>Padre</th>
            <th class="acciones-td">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Filas dinámicas -->
        </tbody>
      </table>
    </div>

    <!-- Modal de edición -->
    <!-- Modal de edición/creación -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="editForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Editar / Crear Menú</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" name="id" id="menu-id" />

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Nombre:</label>
              </div>
              <div class="col-md-9">
                <input
                  type="text"
                  class="form-control"
                  name="nombre"
                  id="nombre"
                  required
                />
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Ruta (URL):</label>
              </div>
              <div class="col-md-9">
                <input
                  type="text"
                  class="form-control"
                  name="ruta"
                  id="ruta"
                  required
                />
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Ícono:</label>
              </div>
              <div class="col-md-9">
                <select
                  class="form-select"
                  name="icono"
                  id="icono-select"
                ></select>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Padre:</label>
              </div>
              <div class="col-md-9">
                <select
                  class="form-select"
                  name="id_padre"
                  id="padre-select"
                ></select>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Tipo:</label>
              </div>
              <div class="col-md-9">
                <select
                  class="form-select"
                  name="id_tipo_menu"
                  id="tipo-select"
                ></select>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Orden:</label>
              </div>
              <div class="col-md-9">
                <input
                  type="number"
                  class="form-control"
                  name="orden"
                  id="orden"
                />
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Estado:</label>
              </div>
              <div class="col-md-9">
                <select class="form-select" name="estado" id="estado">
                  <option value="true">Activo</option>
                  <option value="false">Inactivo</option>
                </select>
              </div>
            </div>

            <!-- Roles -->
            <div class="row mb-2">
              <div class="col-md-3">
                <label class="form-label">Roles:</label>
              </div>
              <div class="col-md-9">
                <div
                  id="roles-container"
                  class="form-check d-flex flex-wrap gap-2"
                >
                  <!-- JS insertará aquí los checkboxes de roles -->
                  <!-- Ejemplo de un checkbox:
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="1" name="roles" id="rol-1">
                  <label class="form-check-label" for="rol-1">Administrador</label>
                </div>
                --></div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts personalizados -->
    <script src="../js/iconos.js"></script>
    <script src="../js/comun.js"></script>
    <script src="../js/render/menusxmodulos.js"></script>
  </body>
</html>
