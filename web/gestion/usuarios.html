<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de Usuario</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 300px; }
  </style>
</head>
<body class="bg-light py-4">

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Usuarios</h2>
    <button class="btn btn-light" onclick="abrirModal()">
      <i class="fa fa-plus"></i> Agregar
    </button>
  </div>

  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Login</th>
        <th>Nombre</th>
        <th>E-mail</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal fade" id="modalEmpresa" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Formulario de Usuario</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
          <li class="nav-item">
            <a class="nav-link active" id="informacion-tab" data-toggle="tab" href="#informacion" role="tab">Información</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="direccion-tab" data-toggle="tab" href="#direccion" role="tab">Dirección</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="empresa-tab" data-toggle="tab" href="#empresa" role="tab">Empresas</a>
          </li>
        </ul>

        <form id="formUsuario" class="tab-content mt-3">
          <!-- Información -->
          <div class="tab-pane fade show active" id="informacion" role="tabpanel">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Ingrese el nombre de usuario">
            </div>
            <div class="form-group">
              <label for="nombres">Nombres</label>
              <input type="text" class="form-control" id="nombres" placeholder="Ingrese los nombres">
            </div>
            <div class="form-group">
              <label for="apellidos">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" placeholder="Ingrese los apellidos">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Ingrese el email">
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="Ingrese la contraseña">
            </div>
          </div>

          <!-- Dirección -->
          <div class="tab-pane fade" id="direccion" role="tabpanel">
            <div class="form-group">
              <label for="region">Región</label>
              <input class="form-control" id="region" placeholder="Región" />
            </div>
            <div class="form-group">
              <label for="provincia">Provincia</label>
              <input class="form-control" id="provincia" placeholder="Provincia" />
            </div>
            <div class="form-group">
              <label for="comuna">Comuna</label>
              <input class="form-control" id="comuna" placeholder="Comuna" />
            </div>
            <div class="form-group">
              <label for="calle">Calle</label>
              <input class="form-control" id="calle" placeholder="Calle" />
            </div>
            <div class="form-group">
              <label for="numero">Número</label>
              <input class="form-control" id="numero" placeholder="Número" />
            </div>
            <div class="form-group">
              <label for="latitud">Latitud</label>
              <input class="form-control" id="latitud" placeholder="Latitud" readonly />
            </div>
            <div class="form-group">
              <label for="longitud">Longitud</label>
              <input class="form-control" id="longitud" placeholder="Longitud" readonly />
            </div>
            <div id="map"></div>
          </div>

          <!-- Empresas -->
          <div class="tab-pane fade" id="empresa" role="tabpanel">
            <div class="form-group">
              <label for="empresaSelect">Empresas</label>
              <select class="form-control" id="empresaSelect">
                <option value="">Selecciona una empresa</option>
                <option value="empresa1">Empresa 1</option>
                <option value="empresa2">Empresa 2</option>
              </select>
            </div>
          </div>

          <!-- Botón guardar -->
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/render/usuarios.js"></script>

<script>
  let mapa;
  let marcador;

  $(document).ready(function () {
    mapa = L.map('map').setView([-33.45, -70.6667], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

    mapa.on('click', function (e) {
      if (marcador) {
        mapa.removeLayer(marcador);
      }
      marcador = L.marker(e.latlng).addTo(mapa);
      $('#latitud').val(e.latlng.lat);
      $('#longitud').val(e.latlng.lng);
    });

    $('#calle, #region, #provincia, #comuna').on('change', function () {
      const direccion = `${$('#calle').val()}, ${$('#comuna').val()}, ${$('#provincia').val()}, ${$('#region').val()}`;
      if (direccion) {
        geocodeDireccion(direccion);
      }
    });
  });

  function geocodeDireccion(direccion) {
    const url = `https://nominatim.openstreetmap.org/search?q=${direccion}&format=json&addressdetails=1&limit=1`;

    $.get(url, function (data) {
      if (data.length > 0) {
        const lugar = data[0];
        const lat = lugar.lat;
        const lon = lugar.lon;

        if (marcador) {
          mapa.removeLayer(marcador);
        }
        marcador = L.marker([lat, lon]).addTo(mapa);
        mapa.setView([lat, lon], 13);
        $('#latitud').val(lat);
        $('#longitud').val(lon);
      } else {
        alert('Dirección no encontrada');
      }
    });
  }

  function abrirModal() {
    $('#modalEmpresa').modal('show');
  }
</script>

</body>
</html>
