<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Tabla de Menús y Roles</title>
        <!-- Bootstrap 5 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Font Awesome -->
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <style>
    /* Personalización de los iconos en los checkboxes */
    .checkbox-ok, .checkbox-no {
      font-size: 20px;
      color: green;
    }
    .checkbox-no {
      color: red;
    }
    .checkbox-wrapper {
      text-align: center;
    }

    table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 20px;
              }
              th, td {
                border: 1px solid #999;
                padding: 8px;
                text-align: center;
              }
              th {
                background-color: #f0f0f0;
              }
              .modal {
                display: none;
                position: fixed;
                top: 15%;
                left: 50%;
                transform: translate(-50%, 0);
                background: white;
                padding: 20px;
                border: 2px solid #444;
                box-shadow: 0 0 10px rgba(0,0,0,0.3);
                z-index: 1001;
              }
              .overlay {
                position: fixed;
                display: none;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.5);
                z-index: 1000;
              }
              .checkbox-ok, .checkbox-no {
                width: 20px;
                height: 20px;
              }
              .checkbox-wrapper {
                text-align: center;
              }  </style>
    </head>
    <body class="bg-light">
        <div class="container py-4">
            <h2 class="text-center mb-4">Asignación de Menús a Roles</h2>
            <div id="tableContainer"></div>
            <div class="d-flex justify-content-center mt-4">
                <button id="guardarCambios"
                    class="btn btn-primary btn-lg">Guardar Cambios</button>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- Bootstrap JS Bundle (incluye Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Scripts personalizados -->
        <script src="../js/comun.js"></script>
        <script src="../js/render/rol-menu.js"></script>
    </body>
