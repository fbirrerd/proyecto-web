<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Medicamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4">
    <a href="index.html" class="btn btn-secondary mb-3">← Volver al listado</a>
    <div id="detalleMedicamento" class="mb-5"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const nombre = params.get("id");

    fetch("medicamentos.json")
        .then(res => {
            if (!res.ok) throw new Error("Error al cargar el archivo de medicamentos");
            return res.json();
        })
        .then(data => {
            const med = data.find(m => m.nombreComercial === nombre);
            const contenedor = document.getElementById("detalleMedicamento");

            if (!med) {
                contenedor.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> Medicamento no encontrado.
                    </div>
                `;
                return;
            }

            let html = `<h2 class="mb-3">${med.nombreComercial}</h2>
                        <img src="img/placeholder.png" class="img-thumbnail mb-4" width="150" alt="Imagen del medicamento">
                        <ul class="list-group">`;

            for (let key in med) {
                html += `<li class="list-group-item"><strong>${key.replace(/([A-Z])/g, ' $1')}:</strong> ${med[key]}</li>`;
            }

            html += "</ul>";
            contenedor.innerHTML = html;
        })
        .catch(error => {
            document.getElementById("detalleMedicamento").innerHTML = `
                <div class="alert alert-danger">
                    <strong>Error:</strong> No se pudo cargar la información. ${error.message}
                </div>
            `;
        });
</script>
</body>
</html>
