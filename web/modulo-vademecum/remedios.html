<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vademécum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container py-5">
  <h1 class="text-center mb-4">Vademécum de Medicamentos</h1>

  <!-- Barra de búsqueda -->
  <div class="row mb-3">
    <div class="col-md-6 offset-md-3">
      <input type="text" id="search" class="form-control" placeholder="🔍 Buscar medicamento, genérico, laboratorio o categoría...">
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-responsive shadow-sm">
    <table class="table table-striped align-middle" id="medTable">
      <thead class="table-primary">
        <tr>
          <th>Imagen</th>
          <th>Nombre Comercial</th>
          <th>Genérico</th>
          <th>Categoría</th>
          <th>Laboratorio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="medicamentos-list">
        <!-- Se inyectan filas desde JS -->
      </tbody>
    </table>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
