<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vademécum de Medicamentos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light py-4">

<div class="container">
    <h2 class="mb-3">Vademécum de Medicamentos</h2>

    <!-- Buscador -->
    <div class="mb-3">
        <input type="text" id="search" class="form-control" placeholder="Buscar medicamento... (mínimo 2 letras)">
    </div>

    <!-- Botones de vista -->
    <div class="mb-3">
        <button id="btnTabla" class="btn btn-primary me-2">Vista Tabla</button>
        <button id="btnCards" class="btn btn-secondary">Vista Cards</button>
    </div>

    <!-- Tabla -->
    <div id="vistaTabla">
        <table class="table table-striped mt-2">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre Comercial</th>
                    <th>Nombre Genérico</th>
                    <th>Categoria</th>
                    <th>Laboratorio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="medicamentos-list">
                <tr>
                    <td colspan="6" class="text-center text-muted">Ingrese al menos 2 letras para buscar</td>
                </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <nav>
            <ul id="pagination" class="pagination justify-content-center"></ul>
        </nav>
    </div>

    <!-- Cards -->
    <div id="vistaCards" class="row d-none"></div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/comun.js"></script>
<script src="js/remedios.js"></script>

</body>
</html>
