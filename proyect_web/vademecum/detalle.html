
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Remedio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/vademecum.css">
</head>
<body>
  <div class="container mt-4">
    <a href="listado.html" class="btn btn-secondary mb-3">← Volver al listado</a>
    <div id="detalle-remedio" class="row">
      <!-- contenido dinámico -->
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="../js/vademecum/detalle.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch('data/remedios.json')
        .then(response => response.json())
        .then(data => cargarDetalle(data));
    });
  
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
  
    function cargarDetalle(remedios) {
      const id = parseInt(getQueryParam('id'));
      const remedio = remedios.find(r => r.id === id);
      if (!remedio) return;
  
      $("#nombre").text(remedio.nombre);
      $("#foto").attr("src", `img/${remedio.foto}`);
      $("#precio").text(remedio.precio);
      $("#uso").text(remedio.uso);
      $("#presentacion").text(remedio.presentacion);
      $("#ingredientes").text(remedio.ingredientes.join(", "));
      $("#gramaje").text(remedio.gramaje);
      $("#registro").text(remedio.registro_sanitario);
      $("#via").text(remedio.via_consumo);
      $("#precauciones").text(remedio.precauciones);
      $("#contraindicaciones").text(remedio.contraindicaciones);
      $("#laboratorio").text(remedio.laboratorio);
  
      // Mostrar remedios similares
      const similares = remedios.filter(r =>
        r.id !== remedio.id &&
        r.ingredientes.includes(remedio.ingredientes[0])
      ).slice(0, 3); // max 3 similares
  
      const contenedorSimilares = $("#similares");
      similares.forEach(sim => {
        contenedorSimilares.append(`
          <div class="card mb-2">
            <div class="card-body">
              <h6>${sim.nombre}</h6>
              <p><strong>Ingrediente:</strong> ${sim.ingredientes.join(", ")}</p>
              <p><strong>Precio:</strong> ${sim.precio}</p>
              <a href="detalle.html?id=${sim.id}" class="btn btn-outline-secondary btn-sm">Comparar</a>
            </div>
          </div>
        `);
      });
    }
  </script>
    
</body>
</html>
