
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vademécum - Listado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/vademecum.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="mb-4 text-center">Vademécum - Listado de Remedios</h1>
    <div class="row mb-3 g-3">
      <div class="col-md-3">
        <input type="text" id="filtro-nombre" class="form-control" placeholder="Buscar por nombre...">
      </div>
      <div class="col-md-3">
        <input type="text" id="filtro-laboratorio" class="form-control" placeholder="Buscar por laboratorio...">
      </div>
      <div class="col-md-3">
        <input type="text" id="filtro-ingrediente" class="form-control" placeholder="Buscar por ingrediente...">
      </div>
      <div class="col-md-3">
        <input type="text" id="filtro-via" class="form-control" placeholder="Buscar por vía de consumo...">
      </div>
    </div>
    <div id="lista-remedios" class="row row-cols-1 row-cols-md-2 g-4"></div>
    <h1 id="nombre"></h1>
    <img id="foto" src="" alt="" class="img-fluid">
    <p id="precio"></p>
    <ul>
      <li><strong>Uso:</strong> <span id="uso"></span></li>
      <li><strong>Presentación:</strong> <span id="presentacion"></span></li>
      <li><strong>Ingredientes:</strong> <span id="ingredientes"></span></li>
      <li><strong>Gramaje:</strong> <span id="gramaje"></span></li>
      <li><strong>Registro Sanitario:</strong> <span id="registro"></span></li>
      <li><strong>Vía de consumo:</strong> <span id="via"></span></li>
      <li><strong>Precauciones:</strong> <span id="precauciones"></span></li>
      <li><strong>Contraindicaciones:</strong> <span id="contraindicaciones"></span></li>
      <li><strong>Laboratorio:</strong> <span id="laboratorio"></span></li>
    </ul>
    
    <h3>Remedios Similares</h3>
    <div id="similares" class="row"></div>
    
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="../js/vademecum/listado.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch('data/remedios.json')
        .then(response => response.json())
        .then(data => cargarListado(data));
    });
  
    function cargarListado(remedios) {
      const contenedor = $("#lista-remedios");
      contenedor.empty();
      remedios.forEach(rem => {
        contenedor.append(`
          <div class="card mb-3">
            <div class="row g-0">
              <div class="col-md-2">
                <img src="img/${rem.foto}" class="img-fluid rounded-start" alt="${rem.nombre}">
              </div>
              <div class="col-md-10">
                <div class="card-body">
                  <h5 class="card-title">${rem.nombre}</h5>
                  <p class="card-text"><strong>Uso:</strong> ${rem.uso}</p>
                  <p class="card-text"><strong>Precio:</strong> ${rem.precio}</p>
                  <a href="detalle.html?id=${rem.id}" class="btn btn-primary">Ver detalles</a>
                </div>
              </div>
            </div>
          </div>
        `);
      });
    }
  </script>  
</body>
</html>
